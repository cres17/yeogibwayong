name: yeogibwayong
description: "여기봐용 - Pet-themed productivity app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.1

  # App usage tracking
  usage_stats: ^1.3.1

  # Background service
  flutter_background_service: ^5.1.0
  workmanager: ^0.9.0+3

  # Overlay
  flutter_overlay_window: ^0.5.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Image handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.1

  # Charts
  fl_chart: ^1.2.0

  # Permissions
  permission_handler: ^12.0.1

  # Ads
  google_mobile_ads: ^8.0.0

  # i18n
  intl: ^0.20.2

  # Settings
  shared_preferences: ^2.3.5

  # App version / build number (shown in Settings → About)
  package_info_plus: ^8.3.0

  # Installed app enumeration (Phase 5)
  device_apps: ^2.2.0
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/pets/
