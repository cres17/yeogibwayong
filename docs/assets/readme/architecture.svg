xt x="60" y="416" font-size="22" fill="#202B38" font-weight="650">시작 · 일시정지 · 재개</text><text x="60" y="446" font-size="16" fill="#657180" font-weight="400">종료 시각으로 남은 시간 계산</text><path d="M373 442 L390 442" fill="none" stroke="#9A6828" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="416" font-size="22" fill="#202B38" font-weight="650">완료 또는 취소</text><text x="416" y="446" font-size="16" fill="#657180" font-weight="400">timer_sessions 기록</text><path d="M729 442 L746 442" fill="none" stroke="#9A6828" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="416" font-size="22" fill="#202B38" font-weight="650">완료 알림</text><text x="772" y="446" font-size="16" fill="#657180" font-weight="400">반려동물 오버레이</text><text x="40" y="581" font-size="13" fill="#657180" font-weight="400">Android 전용. WorkManager가 감시 설정을 확인하고 서비스 복구를 시도합니다.</text></g></svg>